# The tests on each supported Node. They also check the vendored contract against its lock, and that the generated
# files and the committed conformance report are current. A tag runs it through release.yml, on the tagged commit.
name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: The commit to test; release.yml passes the tag
        type: string
        default: ""

permissions:
  contents: read

jobs:
  test:
    name: pnpm test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      # The version comes from packageManager in package.json.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
