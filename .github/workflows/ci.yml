# The tests on each supported Node. They also check the vendored contract against its lock, and that the generated
# files and the committed conformance report are current.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: pnpm test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v5
      # The version comes from packageManager in package.json.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
